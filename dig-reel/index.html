<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Keep Digging</title>
<style>
@font-face{font-family:'Jost';src:url('fonts/Jost.ttf') format('truetype');font-weight:100 900;}
html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}
</style></head><body>
<canvas id="c"></canvas>
<script>
const W = innerWidth, H = innerHeight, S = W / 1080;
const cv = document.getElementById('c'); cv.width = W; cv.height = H;
const g = cv.getContext('2d');
const BEAT = 0.58, DUR = 18 * BEAT;                       // 10.44 s, beat 0 = first frame
const DROP = 7 * BEAT;                                     // the song's drop lands on beat 7
const clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, k) => a + (b - a) * k;
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x * x, eio = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const hash = n => { n = Math.sin(n * 127.1 + 311.7) * 43758.5453; return n - Math.floor(n); };
const D2R = Math.PI / 180;

// ---------- world (screen px at zoom 1) ----------
const GROUND = 1250, TOP = 930;                           // tunnel floor and roof
const GEM = { x: 840, y: 1150 }, CAVE_R = 120;
const FACE0 = 330, STEP = 60, HITS = 6;                    // tunnel face before the first strike; advance per strike
const hitT = i => i * BEAT;                                // strikes on beats 0..5, then the big one on the drop
const UF = 880, UT = 610;                                  // upper tunnel floor and roof (the quitter's level)
const GEM2 = { x: 900, y: 800 }, QFACE0 = 520, QHITS = 4, QUIT = 4 * BEAT;
const LEDGE = [[-900, UF], [350, UF], [330, UF + 22], [-900, UF + 22]];
const MOUNT = [[100, GROUND], [700, 300], [1010, 640], [1180, 520], [1900, GROUND]];
const BACK = [[-700, GROUND], [-180, 560], [260, GROUND]];
const BACK2 = [[1300, GROUND], [1650, 430], [2300, GROUND]];

function faceAt(t) {
  let f = FACE0;
  for (let i = 0; i < HITS; i++) f += STEP * eo(seg(t, hitT(i), hitT(i) + .12));
  return f;
}
const broke = t => t >= DROP;

// ---------- pickaxe swing: arm angle from vertical (deg); strike lands on the beat ----------
function armAngle(t) {
  const WIND = -40, HIT = 88;
  if (t >= DROP) { const u = t - DROP; return u < .5 ? lerp(HIT + 8, 20, eo(u / .5)) : 20; }        // recoil, then rest
  if (t >= 6 * BEAT - .05) {                                // the quiet bar: big wind-up, hold, then the drop strike
    const w = eo(seg(t, 5 * BEAT + .1, 6 * BEAT + .15));
    const sw = ei(seg(t, DROP - .17, DROP));
    return lerp(lerp(HIT, -62, w), HIT + 8, sw);
  }
  const p = (t / BEAT) % 1;
  if (t < 0) return WIND;
  if (p < .12) return lerp(HIT, HIT - 8, p / .12);                     // just struck
  if (p < .62) return lerp(HIT - 8, WIND, eio((p - .12) / .5));       // lift back
  if (p < .78) return WIND;
  return lerp(WIND, HIT, ei((p - .78) / .22));                        // accelerate into the next beat
}

// ---------- the figure ----------
// fx = feet x; returns the pick tip in world coords too
function figure(fx, phi, lift = 0, gy = GROUND) {
  const sh = [fx + 8, gy - 222], hip = [fx, gy - 112];
  const R = 74, a = phi * D2R;
  const grip = [sh[0] + R * Math.sin(a), sh[1] - R * Math.cos(a)];
  const elbow = [lerp(sh[0], grip[0], .5) - 12 * Math.cos(a), lerp(sh[1], grip[1], .5) - 12 * Math.sin(a)];
  const ps = (phi + 14) * D2R, end = [grip[0] + 150 * Math.sin(ps), grip[1] - 150 * Math.cos(ps)];
  const perp = [Math.cos(ps), Math.sin(ps)];
  const tip = [end[0] + perp[0] * 46 + Math.sin(ps) * 16, end[1] + perp[1] * 46 - Math.cos(ps) * 16];
  const back = [end[0] - perp[0] * 40 + Math.sin(ps) * 12, end[1] - perp[1] * 40 - Math.cos(ps) * 12];
  return { fx, gy, sh, hip, grip, elbow, end, tip, back, head: [fx + 14, gy - 262], lift, legs: 0 };
}
function drawFigure(F, withPick = true) {
  g.strokeStyle = '#FFF'; g.fillStyle = '#FFF'; g.lineCap = 'round'; g.lineJoin = 'round';
  g.lineWidth = 14; g.beginPath();
  const sw = 30 * Math.sin(F.legs || 0);
  g.moveTo(F.fx - 30 + sw, F.gy); g.lineTo(...F.hip); g.lineTo(F.fx + 28 - sw, F.gy);
  g.moveTo(...F.hip); g.lineTo(...F.sh);
  if (F.lift > 0) {    // both arms up, holding the gem overhead
    const up = [F.sh[0] + 4, F.sh[1] - lerp(0, 120, F.lift)];
    g.moveTo(...F.sh); g.lineTo(up[0] - 34 * F.lift, up[1] + 30); g.lineTo(up[0] - 10, up[1]);
    g.moveTo(...F.sh); g.lineTo(up[0] + 34 * F.lift, up[1] + 30); g.lineTo(up[0] + 10, up[1]);
  } else { g.moveTo(...F.sh); g.lineTo(...F.elbow); g.lineTo(...F.grip); }
  g.stroke();
  g.beginPath(); g.arc(...F.head, 26, 0, Math.PI * 2); g.fill();
  if (withPick && F.lift <= 0) {
    g.lineWidth = 9; g.beginPath(); g.moveTo(...F.grip); g.lineTo(...F.end); g.stroke();
    g.lineWidth = 11; g.beginPath(); g.moveTo(...F.back); g.quadraticCurveTo(...F.end, ...F.tip); g.stroke();
  }
}

// ---------- the gem ----------
function gem(x, y, s, glow) {
  g.save(); g.translate(x, y); g.scale(s, s);
  if (glow > 0) {
    const gr = g.createRadialGradient(0, 0, 4, 0, 0, 200 * glow + 40);
    gr.addColorStop(0, `rgba(255,255,255,${.55 * glow})`); gr.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = gr; g.beginPath(); g.arc(0, 0, 200 * glow + 40, 0, Math.PI * 2); g.fill();
  }
  g.fillStyle = '#FFF';
  g.beginPath(); g.moveTo(-34, -14); g.lineTo(-18, -32); g.lineTo(18, -32); g.lineTo(34, -14); g.lineTo(0, 34); g.closePath(); g.fill();
  g.strokeStyle = '#000'; g.lineWidth = 2.5; g.globalAlpha = .55; g.beginPath();
  g.moveTo(-34, -14); g.lineTo(34, -14); g.moveTo(-18, -32); g.lineTo(-8, -14); g.lineTo(0, 34); g.moveTo(18, -32); g.lineTo(8, -14); g.lineTo(0, 34); g.stroke();
  g.restore();
}
function rays(x, y, a, t) {
  if (a <= 0) return;
  g.save(); g.translate(x, y); g.rotate(t * .4); g.strokeStyle = `rgba(255,255,255,${.35 * a})`; g.lineWidth = 3; g.lineCap = 'round';
  for (let i = 0; i < 12; i++) { const r0 = 70, r1 = 70 + 110 * a * (.6 + .4 * hash(i)); const an = i / 12 * Math.PI * 2; g.beginPath(); g.moveTo(Math.cos(an) * r0, Math.sin(an) * r0); g.lineTo(Math.cos(an) * r1, Math.sin(an) * r1); g.stroke(); }
  g.restore();
}

// ---------- rubble from each strike ----------
function qRubble(t, tip) {
  for (let i = 0; i < QHITS; i++) { const u = t - hitT(i); if (u < 0 || u > .6) continue;
    for (let k = 0; k < 8; k++) { const sd = 500 + i * 13 + k, x = tip[0] - (100 + 300 * hash(sd)) * u, y = Math.min(UF - 4, tip[1] - (200 + 400 * hash(sd + 7)) * u + 1800 * u * u), sz = 5 + 7 * hash(sd + 3);
      g.fillStyle = `rgba(220,220,220,${1 - u / .6})`; g.fillRect(x - sz / 2, y - sz / 2, sz, sz); } }
}
function rubble(t, tip) {
  const hits = [];
  for (let i = 0; i < HITS; i++) hits.push([hitT(i), 10]);
  hits.push([DROP, 34]);
  for (const [th, n] of hits) {
    const u = t - th; if (u < 0 || u > .75) continue;
    for (let k = 0; k < n; k++) {
      const s = th * 13 + k, vx = -(120 + 380 * hash(s)) * (th === DROP ? 1.6 : 1), vy = -(220 + 520 * hash(s + 7)) * (th === DROP ? 1.3 : 1);
      const x = tip[0] + vx * u, y = Math.min(GROUND - 4, tip[1] + vy * u + 1800 * u * u);
      const sz = 5 + 9 * hash(s + 3);
      g.fillStyle = `rgba(${200 + 55 * hash(s + 5) | 0},${200 + 55 * hash(s + 5) | 0},${200 + 55 * hash(s + 5) | 0},${1 - u / .75})`;
      g.save(); g.translate(x, y); g.rotate(u * 9 * (hash(s + 9) - .5)); g.fillRect(-sz / 2, -sz / 2, sz, sz); g.restore();
    }
  }
}

// ---------- scene ----------
function poly(pts, fill) { g.beginPath(); pts.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.closePath(); g.fillStyle = fill; g.fill(); }
function qFaceAt(t) { let f = QFACE0; for (let i = 0; i < QHITS; i++) f += STEP * eo(seg(t, hitT(i), hitT(i) + .12)); return f; }
// the quitter: same beat for four strikes, then lets the pick drop and walks back out along the ledge
function quitter(t) {
  const qf = qFaceAt(t), reach = 236;
  if (t < QUIT - .25) return { F: figure(qFaceAt(Math.max(0, t - .2)) - reach, armAngle(t), 0, UF), pick: null, dir: 1 };
  const x0 = qFaceAt(QUIT) - reach;
  const slump = eo(seg(t, QUIT - .25, QUIT + .1));
  const F = figure(x0, lerp(armAngle(QUIT - .25), 168, slump), 0, UF);
  const walk = seg(t, QUIT + .35, QUIT + 3.8);
  const pick = t > QUIT + .1 ? { x: x0 + 120, fall: eo(seg(t, QUIT + .1, QUIT + .35)) } : null;
  if (walk > 0) { F.fx = x0 - 1200 * walk; F.legs = walk * 4200 / 60; for (const k of ['sh', 'hip', 'head']) F[k] = [F[k][0] - 1200 * walk, F[k][1]];
    F.grip = [F.sh[0] - 6, F.sh[1] + 96]; F.elbow = [F.sh[0] - 4, F.sh[1] + 50]; }
  return { F, pick, dir: walk > 0 ? -1 : 1, x0 };
}
function world(t, F, face) {
  poly(BACK, '#0C0C0C'); poly(BACK2, '#0C0C0C');
  poly(MOUNT, '#171717');
  g.strokeStyle = '#2E2E2E'; g.lineWidth = 3; g.beginPath(); MOUNT.forEach((p, i) => i ? g.lineTo(...p) : g.moveTo(...p)); g.stroke();
  // the tunnel: carved black, with a rough rock face at its end
  g.fillStyle = '#000'; g.beginPath(); g.moveTo(0, TOP + 30); g.lineTo(face - 20, TOP);
  for (let i = 0; i <= 8; i++) { const y = lerp(TOP, GROUND, i / 8); g.lineTo(face + (hash(i + Math.floor(face)) - .5) * 26, y); }
  g.lineTo(0, GROUND); g.closePath(); g.fill();
  const qf = qFaceAt(t);
  g.fillStyle = '#000'; g.beginPath(); g.moveTo(300, UT + 40); g.lineTo(qf - 20, UT);
  for (let i = 0; i <= 8; i++) { const y = lerp(UT, UF, i / 8); g.lineTo(qf + (hash(i * 3 + Math.floor(qf)) - .5) * 26, y); }
  g.lineTo(300, UF); g.closePath(); g.fill();
  poly(LEDGE, '#171717');
  g.strokeStyle = '#262626'; g.lineWidth = 2; g.beginPath(); g.moveTo(-900, UF); g.lineTo(qf, UF); g.stroke();
  // cracks spreading from the drop strike
  if (broke(t)) {
    const a = eo(seg(t, DROP, DROP + .3));
    g.strokeStyle = `rgba(255,255,255,${.5 * a * (1 - seg(t, DROP + 1.5, DROP + 3))})`; g.lineWidth = 2.5;
    for (let i = 0; i < 9; i++) { let x = GEM.x - 60, y = GEM.y - 40, an = -Math.PI * .2 - i * .33; g.beginPath(); g.moveTo(x, y);
      for (let k = 0; k < 6; k++) { an += (hash(i * 9 + k) - .5) * .8; x += Math.cos(an) * 46 * a; y += Math.sin(an) * 46 * a; g.lineTo(x, y); } g.stroke(); }
    // the cave around the gem opens
    const r = CAVE_R * eo(seg(t, DROP, DROP + .25));
    g.fillStyle = '#000'; g.beginPath(); g.ellipse(GEM.x, GROUND - 110, r * 1.25, Math.min(r, 160), 0, 0, Math.PI * 2); g.fill();
    g.fillRect(face - 40, TOP, GEM.x - face + 40, GROUND - TOP);
  }
  // ground line
  g.strokeStyle = '#262626'; g.lineWidth = 2; g.beginPath(); g.moveTo(-2000, GROUND); g.lineTo(4000, GROUND); g.stroke();
}

let TEXT_LIST = [];
function label(s, x, y, a, size, track, id, pass) {
  if (a <= 0) return;
  g.save(); g.globalAlpha = a; g.fillStyle = '#FFF'; g.font = `500 ${size * S}px Jost`; g.textAlign = 'center'; g.letterSpacing = `${track * S}px`;
  g.fillText(s, x, y); const w = g.measureText(s).width; g.restore();
  TEXT_LIST.push({ id, text: s, x0: x - w / 2, y0: y - size * S, x1: x + w / 2, y1: y + size * .3 * S, pass });
}

// camera: zoom about a world point, stepping back on beats 10, 11, 12
function camera(t) {
  const steps = [[10, .82], [11, .66], [12, .54]];
  let k = 1, cx = 560, cy = 1000;
  for (const [b, kk] of steps) { const u = eo(seg(t, b * BEAT, b * BEAT + .22)); k = lerp(k, kk, u); }
  const z = 1 - (k - .54) / .46;
  cx = lerp(560, 760, z); cy = lerp(1000, 860, z);
  const punch = t >= DROP ? 1 + .03 * Math.exp(-((t / BEAT) % 1) * 7) : 1;
  return { k: k * punch, cx, cy };
}

function render(t) {
  TEXT_LIST = [];
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.filter = 'none';
  g.fillStyle = '#000'; g.fillRect(0, 0, W, H);
  const face = broke(t) ? faceAt(DROP) : faceAt(t);
  // the digger steps forward after each strike to stay at the face
  const reach = 236;
  let fx = faceAt(Math.max(0, t - .2)) - reach;
  if (broke(t)) fx = lerp(faceAt(DROP) - reach, GEM.x - 14, eio(seg(t, 8 * BEAT, 8 * BEAT + .5)));
  const lift = eio(seg(t, 9 * BEAT, 9 * BEAT + .45));
  const F = figure(fx, armAngle(t), lift);
  // gem: in the rock, then carried overhead
  const gemPos = lift > 0 ? [lerp(GEM.x, F.sh[0] + 4, lift), lerp(GEM.y, F.sh[1] - 160, lift)] : [GEM.x, GEM.y];
  const glow = broke(t) ? .6 + .4 * eo(seg(t, DROP, DROP + .4)) + .15 * Math.exp(-((t / BEAT) % 1) * 6) : .22 + .05 * Math.sin(t * 6);

  const C = camera(t);
  g.save(); g.translate(W / 2, H / 2); g.scale(C.k * S, C.k * S); g.translate(-C.cx, -C.cy);
  world(t, F, face);
  // before the break the gem is buried: seen faintly through the rock
  g.save(); if (!broke(t)) g.globalAlpha = .5;
  gem(gemPos[0], gemPos[1], 1, glow); g.restore();
  rays(gemPos[0], gemPos[1], broke(t) ? eo(seg(t, DROP, DROP + .5)) : 0, t);
  // reflection of the figure and gem on the polished floor
  g.save(); g.filter = `blur(${9 * C.k * S}px)`; g.globalAlpha = .2; g.translate(0, 2 * GROUND + 30); g.scale(1, -.9); drawFigure(F); g.restore();
  g.save(); drawFigure(F); g.restore();
  rubble(t, F.tip);
  const Q = quitter(t);
  g.save(); g.globalAlpha = .55; gem(GEM2.x, GEM2.y, 1, .22 + .05 * Math.sin(t * 6 + 1)); g.restore();
  g.save(); if (Q.dir < 0) { g.translate(2 * Q.F.fx, 0); g.scale(-1, 1); } drawFigure(Q.F, !Q.pick); g.restore();
  if (Q.pick) { g.save(); g.strokeStyle = '#FFF'; g.lineCap = 'round'; g.translate(Q.pick.x, UF - 8); g.rotate(lerp(-1.2, 0, Q.pick.fall));
    g.lineWidth = 9; g.beginPath(); g.moveTo(-75, 0); g.lineTo(75, 0); g.stroke(); g.lineWidth = 11; g.beginPath(); g.moveTo(62, -40); g.quadraticCurveTo(75, 0, 62, 40); g.stroke(); g.restore(); }
  if (t < QUIT) qRubble(t, Q.F.tip);
  g.restore();

  // text, in screen space
  const s1 = seg(t, .15, .5) * (1 - seg(t, DROP - .05, DROP));
  const gs = [(gemPos[0] - C.cx) * C.k * S + W / 2, (gemPos[1] - C.cy) * C.k * S + H / 2];
  label('SUCCESS:', gs[0], gs[1] - 120 * S, s1, 30, 4, 's1');
  const g2 = [(GEM2.x - C.cx) * C.k * S + W / 2, (GEM2.y - C.cy) * C.k * S + H / 2];
  label('SUCCESS:', g2[0], g2[1] - 70 * S, s1, 30, 4, 's2');
  const e = seg(t, 12 * BEAT, 12 * BEAT + .08);
  const pulse = 1 + .05 * Math.exp(-((t / BEAT) % 1) * 8) * (e > 0 ? 1 : 0);
  if (e > 0) { g.save(); g.translate(W / 2, 330 * S); g.scale(pulse, pulse); g.translate(-W / 2, -330 * S); label('KEEP DIGGING.', W / 2, 350 * S, e, 60, 9, 'end'); g.restore(); }

  // the drop: a white flash
  const fl = t >= DROP ? Math.max(0, 1 - (t - DROP) / .18) : 0;
  if (fl > 0) { g.fillStyle = `rgba(255,255,255,${fl * .9})`; g.fillRect(0, 0, W, H); }
  const fo = seg(t, DUR - .4, DUR); if (fo > 0) { g.fillStyle = `rgba(0,0,0,${fo})`; g.fillRect(0, 0, W, H); }
}
window.DUR = DUR; window.render = render;
window.TEXTS = t => { render(t); return TEXT_LIST.slice(); };
document.fonts.load('500 30px Jost').then(() => { render(0); window.READY = true; });
</script></body></html>
